<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我想对你说...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: fadeIn 1s ease;
        }
        
        h1 {
            color: #e84393;
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            line-height: 1.4;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        #yes-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        #no-btn {
            background-color: #f44336;
            color: white;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            transform: rotate(45deg);
            opacity: 0;
        }
        
        .heart:before, .heart:after {
            content: '';
            width: 20px;
            height: 20px;
            background: inherit;
            border-radius: 50%;
            position: absolute;
        }
        
        .heart:before {
            top: -10px;
            left: 0;
        }
        
        .heart:after {
            top: 0;
            left: -10px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
            z-index: 100;
        }
        
        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        .success-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts-container"></div>
    
    <div class="container">
        <h1>李韵玲，我喜欢你，你能和我交往吗？</h1>
        
        <div class="buttons">
            <button id="yes-btn">同意</button>
            <button id="no-btn">不同意</button>
        </div>
        
        <div class="success-message" id="success-message">
            太好了！让我们一起创造美好的回忆吧！ ❤️
        </div>
    </div>

    <script>
        // 创建漂浮的心形
        function createHearts() {
            const heartsContainer = document.getElementById('hearts-container');
            const heartCount = 15;
            
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                // 随机位置
                const left = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = 10 + Math.random() * 10;
                
                heart.style.left = `${left}%`;
                heart.style.animation = `float ${duration}s linear ${delay}s infinite`;
                
                heartsContainer.appendChild(heart);
            }
        }
        
        // 创建五彩纸屑效果
        function createConfetti() {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // 随机颜色
                const color = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.backgroundColor = color;
                
                // 随机位置
                const left = Math.random() * 100;
                confetti.style.left = `${left}%`;
                
                // 随机大小
                const size = 5 + Math.random() * 10;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                
                // 随机动画
                const duration = 1 + Math.random() * 2;
                const delay = Math.random() * 2;
                confetti.style.animation = `confetti-fall ${duration}s linear ${delay}s forwards`;
                
                document.body.appendChild(confetti);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    confetti.remove();
                }, (duration + delay) * 1000);
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            createHearts();
            
            const yesBtn = document.getElementById('yes-btn');
            const noBtn = document.getElementById('no-btn');
            const successMessage = document.getElementById('success-message');
            
            let noClicks = 0;
            const originalNoText = noBtn.textContent;
            const originalYesText = yesBtn.textContent;
            
            // 同意按钮点击事件
            yesBtn.addEventListener('click', function() {
                successMessage.style.display = 'block';
                createConfetti();
                
                // 播放成功音效
                const audio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==');
                audio.play().catch(e => console.log("Audio play failed:", e));
                
                // 禁用按钮
                yesBtn.disabled = true;
                noBtn.disabled = true;
            });
            
            // 不同意按钮点击事件
            noBtn.addEventListener('click', function() {
                noClicks++;
                
                if (noClicks === 1) {
                    // 第一次点击不同意
                    noBtn.textContent = "你确定吗？";
                    yesBtn.style.transform = "scale(1.1)";
                } else if (noClicks === 2) {
                    // 第二次点击不同意
                    noBtn.textContent = "再考虑一下？";
                    yesBtn.style.transform = "scale(1.2)";
                } else if (noClicks === 3) {
                    // 第三次点击不同意
                    noBtn.textContent = "真的不再想想？";
                    yesBtn.style.transform = "scale(1.3)";
                } else {
                    // 第四次及以后点击不同意
                    // 交换按钮文字和功能
                    const tempText = yesBtn.textContent;
                    yesBtn.textContent = "不同意也得同意";
                    noBtn.textContent = "同意";
                    
                    // 让"不同意也得同意"按钮变大
                    yesBtn.style.transform = "scale(1.5)";
                    yesBtn.style.fontSize = "1.5rem";
                    yesBtn.style.padding = "20px 40px";
                    
                    // 交换点击事件
                    const tempClick = yesBtn.onclick;
                    yesBtn.onclick = noBtn.onclick;
                    noBtn.onclick = tempClick;
                    
                    // 重置点击计数器
                    noClicks = 0;
                }
                
                // 移动"不同意"按钮到随机位置
                const maxX = window.innerWidth - noBtn.offsetWidth - 50;
                const maxY = window.innerHeight - noBtn.offsetHeight - 50;
                const randomX = Math.floor(Math.random() * maxX);
                const randomY = Math.floor(Math.random() * maxY);
                
                noBtn.style.position = "fixed";
                noBtn.style.left = `${randomX}px`;
                noBtn.style.top = `${randomY}px`;
            });
        });
    </script>
</body>
</html>
