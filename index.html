<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李韵玲，我想对你说...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .heart-decoration {
            position: absolute;
            font-size: 24px;
            color: #ff6b6b;
            opacity: 0.3;
            z-index: 0;
        }
        
        .heart-1 { top: 20px; left: 30px; }
        .heart-2 { top: 60px; right: 40px; }
        .heart-3 { bottom: 50px; left: 50px; }
        .heart-4 { bottom: 30px; right: 60px; }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        h1 {
            color: #e84393;
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .message {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #555;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-width: 140px;
        }
        
        .yes-btn {
            background-color: #6c5ce7;
            color: white;
        }
        
        .yes-btn:hover {
            background-color: #5b4fcf;
            transform: translateY(-3px);
        }
        
        .no-btn {
            background-color: #fd79a8;
            color: white;
        }
        
        .no-btn:hover {
            background-color: #e84393;
            transform: translateY(-3px);
        }
        
        .result {
            margin-top: 30px;
            font-size: 1.8rem;
            color: #e84393;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            min-height: 60px;
        }
        
        .show {
            opacity: 1;
        }
        
        /* 动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .message {
                font-size: 1.3rem;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1rem;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart-decoration heart-1">❤</div>
        <div class="heart-decoration heart-2">❤</div>
        <div class="heart-decoration heart-3">❤</div>
        <div class="heart-decoration heart-4">❤</div>
        
        <div class="content">
            <h1>李韵玲，我想对你说...</h1>
            <p class="message">李韵玲，我喜欢你，你能和我交往吗？</p>
            
            <div class="buttons">
                <button class="btn yes-btn pulse" id="yesBtn">同意</button>
                <button class="btn no-btn" id="noBtn">不同意</button>
            </div>
            
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const result = document.getElementById('result');
            
            let noClickCount = 0;
            
            noBtn.addEventListener('click', function() {
                noClickCount++;
                
                if (noClickCount === 1) {
                    // 第一次点击"不同意"
                    yesBtn.textContent = "不同意也得同意";
                    noBtn.textContent = "同意";
                    
                    // 交换按钮位置
                    const buttonsContainer = document.querySelector('.buttons');
                    buttonsContainer.insertBefore(noBtn, yesBtn);
                    
                    // 放大"同意"按钮
                    yesBtn.style.transform = 'scale(1.2)';
                    yesBtn.classList.remove('pulse');
                    noBtn.classList.add('pulse');
                } else {
                    // 后续点击会随机移动"不同意"按钮
                    const container = document.querySelector('.container');
                    const maxX = container.offsetWidth - noBtn.offsetWidth;
                    const maxY = container.offsetHeight - noBtn.offsetHeight;
                    
                    const randomX = Math.floor(Math.random() * maxX);
                    const randomY = Math.floor(Math.random() * maxY);
                    
                    noBtn.style.position = 'absolute';
                    noBtn.style.left = randomX + 'px';
                    noBtn.style.top = randomY + 'px';
                }
            });
            
            yesBtn.addEventListener('click', function() {
                result.textContent = "让我们一起共创辉煌！";
                result.classList.add('show');
                
                // 移除所有按钮的事件监听器
                yesBtn.removeEventListener('click', arguments.callee);
                noBtn.removeEventListener('click', arguments.callee);
                
                // 隐藏按钮
                yesBtn.style.display = 'none';
                noBtn.style.display = 'none';
                
                // 添加庆祝效果
                celebrate();
            });
            
            function celebrate() {
                const container = document.querySelector('.container');
                
                for (let i = 0; i < 20; i++) {
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤';
                    heart.style.position = 'absolute';
                    heart.style.color = '#ff6b6b';
                    heart.style.fontSize = Math.random() * 20 + 20 + 'px';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = Math.random() * 100 + '%';
                    heart.style.opacity = '0';
                    heart.style.transition = 'all 1s ease';
                    
                    container.appendChild(heart);
                    
                    // 触发动画
                    setTimeout(() => {
                        heart.style.opacity = '1';
                        heart.style.transform = 'translateY(-100px)';
                    }, 10);
                    
                    // 移除元素
                    setTimeout(() => {
                        heart.remove();
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
